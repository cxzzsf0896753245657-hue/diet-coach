<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>減重教練</title>
<style>
:root{--bg:#f2f5f1;--ink:#1c2b26;--mut:#68776f;--card:#fff;--ac:#2f7d5b;--warn:#c8841a;--ln:#dde5df}
@media(prefers-color-scheme:dark){:root{--bg:#121a17;--ink:#e6efe9;--mut:#93a39a;--card:#1a2420;--ac:#5cc496;--warn:#e3a84b;--ln:#2a3832}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Noto Sans TC",sans-serif;padding:env(safe-area-inset-top) 0 0}
main{max-width:560px;margin:auto;padding:12px 16px 96px}
h1{font-size:20px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sm{padding:6px 14px;font-size:14px}h2{font-size:17px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:20px}.stats span,.mut{color:var(--mut);font-size:13px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer;display:inline-block}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
input[type=checkbox]{width:auto;margin:0 8px 0 0}.tm{display:grid;grid-template-columns:1fr 1fr;gap:8px}h3{font-size:15px;margin:6px 0}
summary{cursor:pointer;font-size:14px}
.seg{display:flex;border:1px solid var(--ac);border-radius:10px;overflow:hidden}.seg button{flex:1;border-radius:0;background:transparent;color:var(--ac);padding:8px 4px}.seg button.on{background:var(--ac);color:#fff}
.nav{justify-content:space-between;align-items:center;margin-bottom:6px}.nav button{padding:4px 16px}button:disabled{opacity:.35;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:6px 0}.cal span{font-size:12px}
.cal button{aspect-ratio:1;padding:0;border-radius:8px;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--ln);position:relative}
.cal .g{background:color-mix(in srgb,var(--ac) 38%,var(--card))}.cal .a{background:color-mix(in srgb,var(--warn) 45%,var(--card))}
.cal .sel{outline:2px solid var(--ink);outline-offset:1px}.cal .dot::after{content:'';position:absolute;left:calc(50% - 2px);bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--ink)}
.li{display:grid;gap:8px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--ln);border-radius:10px;margin-bottom:6px;padding:10px;font-size:14px}
svg{touch-action:manipulation;cursor:pointer}.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 8px;vertical-align:middle}
#mdlg{width:min(92vw,520px)}textarea{resize:vertical}
.hx{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;margin:6px 0}.hx span{color:var(--mut)}.hx b{color:var(--ink);font-weight:600}
.tab #meals .card{padding:10px;margin-bottom:8px}#meals .meal img{width:52px;height:52px}
.act{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}.big{padding:14px 8px;text-align:center;font-size:16px;display:block}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
#nav button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:8px 0 6px;font-size:12px;line-height:1.3}#nav button{display:flex;flex-direction:column;align-items:center}#nav .ic{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:15px;margin-bottom:2px;transition:background .15s}#nav button.on{color:var(--ac);font-weight:600}#nav button.on .ic{background:color-mix(in srgb,var(--ac) 18%,transparent)}
details.card summary{padding:2px 0}details.card[open] summary{margin-bottom:8px}.tab h2:first-child{margin-top:4px}
img:not([src]){visibility:hidden}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--ln);border-radius:12px;max-width:90vw;max-height:80vh;overflow:auto}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,textarea,select{font:inherit;width:100%;padding:9px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);margin:4px 0 10px}
.meal{display:flex;gap:10px;align-items:center}.meal img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.rv{white-space:pre-wrap}#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:9;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:none}
</style></head><body><main>

</div></section>

<label>目標體重 (kg)<input id="wt" type="number" step="0.1"></label>

<label><input type="checkbox" id="rm" checked>每月檢討</label><div class="tm"><select id="rmd"><option value="1">1 日</option><option value="2">2 日</option><option value="3">3 日</option><option value="4">4 日</option><option value="5">5 日</option><option value="6">6 日</option><option value="7">7 日</option><option value="8">8 日</option><option value="9">9 日</option><option value="10">10 日</option><option value="11">11 日</option><option value="12">12 日</option><option value="13">13 日</option><option value="14">14 日</option><option value="15">15 日</option><option value="16">16 日</option><option value="17">17 日</option><option value="18">18 日</option><option value="19">19 日</option><option value="20">20 日</option><option value="21">21 日</option><option value="22">22 日</option><option value="23">23 日</option><option value="24">24 日</option><option value="25">25 日</option><option value="26">26 日</option><option value="27">27 日</option><option value="28">28 日</option></select><input id="rmt" type="time" value="20:00"></div>
<button id="remind" class="alt">套用提醒時間</button></details>

<select id="bkr"><option value="none">只備份資料（檔案小）</option><option value="90">資料＋近 90 天照片</option><option value="all">資料＋全部照片（檔案大）</option></select>
<div class="row"><button id="bk">匯出備份</button><label class="btn alt">匯入還原<input id="bki" type="file" accept=".json,application/json" hidden></label></div>

</section>
</main>
<nav id="nav" aria-label="主選單"><button data-tab="today"><span class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg></span><span>今天</span></button><button data-tab="trend"><span class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16"/><path d="M8 15l3.5-4 3 3L20 7"/></svg></span><span>趨勢</span></button><button data-tab="hist"><span class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span><span>歷史</span></button><button data-tab="food"><span class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M9 8c0-1.6 1.2-1.6 1.2-3.2M14 8c0-1.6 1.2-1.6 1.2-3.2"/></svg></span><span>食物庫</span></button><button data-tab="set"><span class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.2" fill="var(--card)"/><circle cx="15.5" cy="12" r="2.2" fill="var(--card)"/><circle cx="8" cy="17" r="2.2" fill="var(--card)"/></svg></span><span>設定</span></button></nav><dialog id="mdlg"><b>新增餐點</b>
<img id="mpv" alt="餐點照片" hidden style="width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin:8px 0">
<label>補充說明（選填，讓 AI 判斷更準）<textarea id="mdesc" rows="3" placeholder="例如：雞腿便當，飯吃一半，沒吃雞皮，加一份青菜"></textarea></label>
<b style="font-size:14px">從食物庫加入</b>
<input id="msq" placeholder="搜尋食物庫…" style="margin-top:6px"><div id="msr"></div>
<div id="msel"></div><p class="mut" id="msum" style="margin:4px 0"></p>
<div class="row" style="margin-top:8px"><button id="mgo">AI 分析</button><button class="alt" id="mx">取消</button></div></dialog>
<dialog id="dlg"><b id="dtt"></b><div class="rv" id="dtx" style="margin:10px 0"></div><button onclick="this.closest('dialog').close()">關閉</button></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),K='dietcoach_v1';
let db=JSON.parse(localStorage.getItem(K)||'{"days":{},"p":{},"rv":{}}');
db.foods??=[];
db.rvh??=Object.entries(db.rv||{}).map(([kind,v])=>({kind,...v}));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('儲存空間已滿，請清除舊照片')}};
const ymd=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>ymd(new Date()),day=k=>db.days[k]??={meals:[]};
const kin=d=>(d.meals||[]).reduce((a,m)=>a+(m.ai?.kcal||0),0);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}

async function sync(days=30){
  const H=window.Capacitor?.Plugins?.Health;
  if(!H)return toast('請在 Android App 內使用同步');
  const ok=[],fails=[];
  try{
    const a=await H.isAvailable();
    if(!a.available){await H.openHealthConnectSettings();return toast('請先安裝或更新 Health Connect')}
    await H.requestAuthorization({read:RD,write:[],requestHistoryAccess:true});
    const end=new Date(),start=new Date(end-days*864e5);start.setHours(0,0,0,0);
    const q={startDate:start.toISOString(),endDate:end.toISOString()},dk=s=>ymd(new Date(s.startDate)),num=s=>+(s.value??s.values?.sum??s.values?.average??0);
    const agg=async(t,g)=>(await H.queryAggregated({dataType:t,...q,bucket:'day',aggregation:g})).samples;
    const rs=async(t,limit=2000)=>(await H.readSamples({dataType:t,...q,limit,ascending:true})).samples;
    const err=e=>/permission|authori|denied/i.test(e.message)?'未授權':e.message,hh=k=>day(k).h??={};
    const put=(sp,k,v)=>{if(sp.pct&&v<=1)v*=100;if(sp.f)v=sp.f(v);if(!isFinite(v))return 0;const d=day(k);if(sp.top)d[sp.top]=sp.top==='weight'?+v.toFixed(1):Math.round(v);else hh(k)[sp.k]=+v.toFixed(1);return 1};
    for(const sp of SPEC){
      try{
        const m=new Map();
        if(sp.how==='last'){for(const s of await rs(sp.t,1000))m.set(dk(s),num(s))}
        else{
          let done=false;
          try{for(const s of await agg(sp.t,sp.how==='sum'?'sum':'average'))m.set(dk(s),num(s));done=true}catch(_){}
          if(!done){const g={};for(const s of await rs(sp.t,5000))(g[dk(s)]??=[]).push(num(s));
            for(const[k,v]of Object.entries(g))m.set(k,v.reduce((x,y)=>x+y,0)/(sp.how==='sum'?1:v.length))}
        }
        let n=0;for(const[k,v]of m)n+=put(sp,k,v);if(n)ok.push(`${sp.n} ${n} 天`);
      }catch(e){fails.push(`${sp.n}：${err(e)}`)}
    }
    // 總消耗熱量
    try{const sm=await agg('totalCalories','sum');sm.forEach(s=>day(dk(s)).kcalOut=Math.round(num(s)));ok.push(`消耗熱量 ${sm.length} 天`)}
    catch(_){try{const sm=await agg('calories','sum');sm.forEach(s=>day(dk(s)).kcalOut=Math.round(num(s)));
        try{(await agg('basalCalories','sum')).forEach(s=>{const d=day(dk(s));d.kcalOut=(d.kcalOut||0)+Math.round(num(s))})}catch(__){}
        ok.push(`消耗熱量(活動${'+'}基礎) ${sm.length} 天`)}catch(e){fails.push('消耗熱量：'+err(e))}}
    // 睡眠（每天睡了幾小時，算在醒來那天）
    try{const g={};for(const s of await rs('sleep',3000)){const st=String(s.sleepState??'').toLowerCase();if(/awake|out/.test(st)||!s.endDate)continue;
        const k=ymd(new Date(s.endDate));g[k]=(g[k]||0)+(new Date(s.endDate)-new Date(s.startDate))/36e5}
      let n=0;for(const[k,v]of Object.entries(g))if(v>0){hh(k).sleep=+v.toFixed(1);n++}if(n)ok.push(`睡眠 ${n} 天`)}catch(e){fails.push('睡眠：'+err(e))}
    // 血壓（當天最後一筆）
    try{let n=0;for(const s of await rs('bloodPressure',500)){const sy=s.systolic??s.value?.systolic,di=s.diastolic??s.value?.diastolic;if(sy&&di){hh(dk(s)).bp=`${Math.round(sy)}/${Math.round(di)}`;n++}}if(n)ok.push(`血壓 ${n} 筆`)}catch(e){fails.push('血壓：'+err(e))}
    // 運動紀錄
    try{if(H.queryWorkouts){const r=await H.queryWorkouts({...q,limit:300,ascending:true}),L=r.workouts||r.samples||[],byDay={};
        L.forEach(w=>{const min=Math.round((new Date(w.endDate)-new Date(w.startDate))/6e4);if(!(min>0))return;(byDay[dk(w)]??=[]).push({n:String(w.workoutType??w.type??'運動'),min,kcal:Math.round(w.totalEnergyBurned??w.calories??0)})});
        Object.entries(byDay).forEach(([k,v])=>hh(k).wk=v);if(L.length)ok.push(`運動紀錄 ${L.length} 筆`)}}catch(e){fails.push('運動紀錄：'+err(e))}
    db.syncLog={at:new Date().toLocaleString(),ok,fails};save();render();
    toast(fails.length?`同步完成，${fails.length} 項失敗（見同步詳情）`:`已同步最近 ${days} 天`);
  }catch(e){toast('同步失敗：'+e.message)}
}

async function ai(content,system,max=1500){
  const p=db.p,blocks=typeof content==='string'?[{type:'text',text:content}]:content;
  if((p.prov||'gemini')==='gemini'){
    if(!p.gkey)throw Error('請先在設定填入 Gemini API Key');
    const model=p.gmodel||'gemini-3.1-flash-lite';
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',
      headers:{'content-type':'application/json','x-goog-api-key':p.gkey},
      body:JSON.stringify({systemInstruction:{parts:[{text:system}]},
        contents:[{role:'user',parts:blocks.map(b=>b.type==='image'?{inlineData:{mimeType:b.source.media_type,data:b.source.data}}:{text:b.text})}],
        generationConfig:{maxOutputTokens:Math.max(max*4,2048)}})});
    const j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);
    const t=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('');
    if(!t)throw Error('AI 沒有回覆內容，請再試一次');return t;
  }
  if(!p.key)throw Error('請先在設定填入 Claude API Key');
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':p.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},

  document.querySelectorAll('#trs button').forEach(b=>b.classList.toggle('on',b.dataset.n==String(tr)));
  const md=k=>(+k.slice(5,7))+'/'+(+k.slice(8)),N=trN(),ks=[...Array(N)].map((_,i)=>ymd(new Date(Date.now()-(N-1-i)*864e5)));

  if(pts.length<2){el.innerHTML='<text x="10" y="90" font-size="13" fill="var(--mut)">同步體重資料後會顯示趨勢</text>';$('#wsum').textContent='還沒有足夠的體重資料。';wc=null}
  else{

    const path=ma.map((p,j)=>(j?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(''),a=ma[0],z=ma.at(-1);

      +`<circle cx="${x(z[0])}" cy="${y(z[1])}" r="4" fill="var(--ac)"/><text x="${x(z[0])-6}" y="${y(z[1])-8}" text-anchor="end" font-size="11" font-weight="600" fill="var(--ink)">${z[1].toFixed(1)}</text>`

    s+=wt?`｜距離目標 ${(last-wt).toFixed(1)}kg`:'｜尚未設定目標';
    if(wt&&last>wt&&first>last&&span>=7){const eta=new Date(Date.now()+(last-wt)/((first-last)/span)*864e5);s+=`\n照這段期間的速度，粗估約 ${ymd(eta)} 達標`}

  $('#cal').innerHTML=[0,top/2,top].map(v=>`<line x1="${L}" x2="${W-R}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--ln)"/><text x="${L-5}" y="${yy(v)+3}" text-anchor="end" font-size="10" fill="var(--mut)">${v}</text>`).join('')
